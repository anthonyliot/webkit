<!DOCTYPE html><!-- webkit-test-runner [ WebAnimationsCustomFrameRateEnabled=true ] -->
<html>
<body>
<div id="target" style="width: 50px; height: 50px; background: blue; position: relative;"></div>
<script src="../../resources/js-test.js"></script>
<script src="../../resources/ui-helper.js"></script>
<script src="resources/display-link.js"></script>
<script>
description("An animation that asks for the highest frame rate makes the page render at the display's full rate, and the display link asks for it, although the page renders at about 60 fps by default.");
jsTestIsAsync = true;

(async () => {
    // The animation's frame rate is capped by the display's rate when the animation starts, so start it afterwards.
    await useNominalFramesPerSecond(240);
    // A property that isn't accelerated, so that the animation needs rendering updates.
    document.getElementById("target").animate({ left: ["0px", "200px"] }, { duration: 1000, iterations: Infinity, frameRate: "highest" });
    await expectRequestedFramesPerSecond("The display link asks for the display's full rate, 240 fps.", () => 240);
    finishJSTest();
})();
</script>
</body>
</html>
