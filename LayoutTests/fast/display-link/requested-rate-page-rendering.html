<!DOCTYPE html>
<html>
<body>
<div id="box" style="width: 50px; height: 50px; background: blue;"></div>
<script src="../../resources/js-test.js"></script>
<script src="../../resources/ui-helper.js"></script>
<script src="resources/display-link.js"></script>
<script>
description("A page rendering with requestAnimationFrame makes the display link ask for the page's rendering rate (about 60 fps), not the display's full rate.");
jsTestIsAsync = true;

startAnimationFrameLoop();
(async () => {
    await useNominalFramesPerSecond(240);
    await expectRequestedFramesPerSecond("The display link asks for 60 fps.", () => 60);
    finishJSTest();
})();
</script>
</body>
</html>
