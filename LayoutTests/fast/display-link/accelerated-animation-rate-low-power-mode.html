<!DOCTYPE html><!-- webkit-test-runner [ ThreadedTimeBasedAnimationsEnabled=false ] -->
<html>
<head>
<style>
.box { width: 40px; height: 40px; background: purple; margin: 20px; }
.spinning { animation: spin 1s linear infinite; }
.fading { animation: fade 1s linear infinite alternate; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes fade { from { opacity: 1; } to { opacity: 0.2; } }
</style>
</head>
<body>
<div id="spinner" class="box"></div>
<div id="fader" class="box"></div>
<script src="../../resources/js-test.js"></script>
<script src="../../resources/ui-helper.js"></script>
<script src="resources/display-link.js"></script>
<script>
description("In low power mode, accelerated animations run at the throttled rendering rate: their Core Animation animations ask for 30 fps.");
jsTestIsAsync = true;

if (window.internals)
    internals.setLowPowerModeEnabled(true);
(async () => {
    await useNominalFramesPerSecond(240);
    // Start the animations now: an animation keeps the frame rate it was created with.
    document.getElementById("spinner").classList.add("spinning");
    document.getElementById("fader").classList.add("fading");
    await expectAnimationFramesPerSecond("The transform animation asks for 30 fps.", document.getElementById("spinner"), 30);
    await expectAnimationFramesPerSecond("The opacity animation asks for 30 fps.", document.getElementById("fader"), 30);
    finishJSTest();
})();
</script>
</body>
</html>
